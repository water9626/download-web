<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Communication Equipment Supplier</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f7f9fc;
            color: #222;
        }
        .category-nav {
            background: #ffffff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            margin-bottom: 28px;
        }
        .category-nav .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .category-item {
            padding: 9px 22px;
            border-radius: 8px;
            background-color: #f4f7fb;
            color: #222;
            text-decoration: none;
            transition: 0.22s ease;
        }
        .category-item.active {
            background-color: #1f56d3;
            color: #ffffff;
        }
        .category-item:hover:not(.active) {
            background-color: #e2e8f0;
        }
        .main-content {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 20px;
            min-height: calc(100vh - 260px);
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 22px;
            margin-bottom: 40px;
        }
        .product-card {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .product-body {
            padding: 14px;
        }
        .product-title {
            font-size:16px;
            font-weight:500;
            margin-bottom:6px;
        }
        .product-desc {
            font-size:13px;
            color:#666;
            margin-bottom:8px;
        }
        .product-price {
            font-size:15px;
            color:#d32f2f;
            font-weight:bold;
        }
        .page-footer {
            background-color: #1a2436;
            color: #cbd5e1;
            padding: 32px 20px;
            margin-top: 60px;
        }
        .footer-inner {
            max-width: 1240px;
            margin: 0 auto;
        }
        .footer-contact p {
            margin: 8px 0;
            font-size: 15px;
        }
        .footer-contact a {
            color: #4ade80;
            text-decoration: none;
        }
        .footer-contact a:hover {
            text-decoration: underline;
        }
        .footer-copyright {
            margin-top:16px;
            font-size:13px;
            color:#94a3b8;
        }
        @media (max-width:768px) {
            .category-nav .container {
                gap:8px;
            }
            .category-item {
                padding:7px 14px;
                font-size:14px;
            }
            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px,1fr));
            }
        }
    </style>
</head>
<body>

<div class="category-nav">
    <div class="container">
        <a class="category-item active" href="#all">全部</a>
        <a class="category-item" href="#sfp">SFP模块</a>
        <a class="category-item" href="#switch">交换机</a>
        <a class="category-item" href="#onu">ONU设备</a>
        <a class="category-item" href="support.html">技术支持</a>
        <a class="category-item" href="#contact">联系我们</a>
    </div>
</div>

<main class="main-content">
    <div class="product-grid" id="productContainer"></div>
</main>

<footer class="page-footer" id="contact">
    <div class="footer-inner">
        <div class="footer-contact" id="footerContact"></div>
        <div class="footer-copyright" id="footerCopyright"></div>
    </div>
</footer>

<script>
let allProducts = [];
let siteConfig = {};

async function loadAllData(){
    //加载全局设置
    const settingsRes = await fetch("./site-settings.json");
    siteConfig = await settingsRes.json();
    renderFooter();

    //加载产品
    const productRes = await fetch("./products.json");
    const productData = await productRes.json();
    allProducts = productData.items || [];
    renderProduct("all");
}

function renderFooter(){
    const contactDom = document.getElementById("footerContact");
    const copyDom = document.getElementById("footerCopyright");
    contactDom.innerHTML = `
        <p>📧 Email：${siteConfig.email||""}</p>
        <p>💬 WhatsApp：<a href="https://wa.me/${siteConfig.whatsapp||""}" target="_blank">${siteConfig.whatsapp_text||""}</a></p>
    `;
    copyDom.innerText = siteConfig.copyright||"";
}

function renderProduct(filterCat){
    const container = document.getElementById("productContainer");
    let list = allProducts;
    if(filterCat !== "all"){
        list = allProducts.filter(item=> item.category === filterCat);
    }
    container.innerHTML = "";
    list.forEach(p=>{
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
            <img src="${p.image||''}" alt="${p.name}">
            <div class="product-body">
                <div class="product-title">${p.name}</div>
                <div class="product-desc">${p.desc||""}</div>
                <div class="product-price">${p.price||""}</div>
            </div>
        `;
        container.appendChild(card);
    })
}

document.querySelectorAll('.category-item').forEach(el => {
    el.addEventListener('click', e => {
        const href = el.getAttribute("href");
        if(href.startsWith("http") || href.endsWith(".html")){
            return;
        }
        if(href.startsWith("#")){
            e.preventDefault();
            if(href === "#contact") return;
            document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            const catKey = href.replace('#','');
            renderProduct(catKey);
        }
    })
})

window.onload = loadAllData;
</script>
</body>
</html>
