<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibershow - Professional PON Hardware</title>
    <!-- 引入科技感字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 顶部导航栏 -->
    <header class="tech-header">
        <div class="logo-container">
            <!-- 这里使用了 Orbitron 字体来模拟科技 Logo -->
            <div class="logo-text">Fibershow</div>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Products</a></li>
                <li><a href="support.html">Support & Download</a></li>
                <li><a href="#contact">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <!-- 主体内容区 -->
    <main class="hero-section">
        <div class="hero-content">
            <h1>Professional PON Hardware</h1>
            <p class="subtitle">High-performance SFP ONU, OLT, and Fiber Optic Solutions.</p>
            
            <!-- 搜索框 -->
            <div class="search-box">
                <input type="text" id="productSearch" placeholder="Search products (e.g., MA5671A)...">
            </div>
        </div>
        
        <!-- 产品展示网格 (由 JS 动态生成) -->
        <div id="product-grid" class="grid-container">
            <!-- 产品卡片会在这里显示 -->
        </div>
    </main>

    <!-- 底部 -->
    <footer id="contact">
        <p>&copy; 2026 Fibershow. All rights reserved.</p>
        <div class="contact-info">
            <span>Email: sample@example.com</span>
            <span>WhatsApp: +86 15727789912</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
