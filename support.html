<script>
async function loadProducts() {
  const res = await fetch('/products.json?t=' + Date.now());
  const allProducts = await res.json();
  const wrap = document.getElementById('container');

  if (!wrap) return;

  allProducts.forEach(function(product) {
    let html = '<div class="product-card" style="border:1px solid #eee;padding:20px;margin:16px 0;border-radius:8px;">' +
      '<h2>' + product.name + '</h2>' +
      '<p>' + product.desc + '</p>' +
      '<h3>Videos / Tutorials</h3>' +
      '<ul>';

    // 视频列表
    if (product.videoUrlList && Array.isArray(product.videoUrlList)) {
      product.videoUrlList.forEach(function(v) {
        html += '<li><a href="' + v.url + '" target="_blank">' + v.title + '</a></li>';
      });
    }

    html += '</ul>';

    // 软件工具
    if (product.softwareList && Array.isArray(product.softwareList) && product.softwareList.length > 0) {
      html += '<h3>Software / Tools</h3><ul>';
      product.softwareList.forEach(function(s) {
        html += '<li><a href="' + s.url + '" target="_blank">' + s.title + '</a></li>';
      });
      html += '</ul>';
    }

    // 固件
    if (product.firmwareList && Array.isArray(product.firmwareList) && product.firmwareList.length > 0) {
      html += '<h3>Firmware</h3><ul>';
      product.firmwareList.forEach(function(f) {
        html += '<li><a href="' + f.url + '" target="_blank">' + f.title + '</a></li>';
      });
      html += '</ul>';
    }

    html += '</div>';
    wrap.innerHTML += html;
  });
}

loadProducts();
</script>
