<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support & Download - Fibershow</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="tech-header">
        <div class="logo-container">
            <div class="logo-text">Fibershow</div>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Products</a></li>
                <li><a href="support.html" class="active">Support & Download</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="support-page-content">
            <h1>Support & Downloads</h1>
            
            <div id="product-list" class="product-grid">
                <!-- 这里将由 JS 动态生成产品卡片 -->
            </div>
        </div>
    </main>

    <script>
        // 这是你提供的 JSON 数据
        const products = [
            {
                "category": "HW-ma5671A SFP ONU",
                "name": "MA5671A",
                "desc": "GPON SFP ONU Stick",
                "videoUrlList": [
                    { "title": "Settings for using MA5671A with MikroTik (Chinese)", "url": "https://youtu.be/ygxaMOKvX7Y?is=EN1JAr7x5U7uGoeJ" },
                    { "title": "16-digit to 12-digit LOID/SN converter", "url": "https://youtu.be/1uWbhbN80os?is=hybT2ZSZ85rAC1Q5" },
                    { "title": "10G Xgspon 8311", "url": "https://youtu.be/FBBT3GTuYtw?is=Vy9_tgmbJXeZGQKW" }
                ],
                "pdfList": [],
                "softwareList": [
                    { "title": "Download M5671A ONU Dedicated Configuration Tool", "url": "https://github.com/wifixshare/gpon-stick-configuration-tool/releases/" }
                ],
                "firmwareList": []
            },
            {
                "category": "ODI PONstick",
                "name": "ODI RTL9601d stick",
                "desc": "ODI RTL9601d stick",
                "videoUrlList": [
                    { "title": "MAC Key Calculation for ODI", "url": "https://youtu.be/TD4QhAxm4R8?is=lw5UrqiTHv8E3_3m" },
                    { "title": "Detailed ODI Setup Tutorial", "url": "https://r1bnc.com/post/94/" },
                    { "title": "Detailed ODI/vsol Setup Tutorial", "url": "https://github.com/Anime4000/RTL960x/blob/main/Docs/Setup_Stick.md" }
                ],
                "pdfList": [],
                "softwareList": [
                    { "title": "MAC Key Calculation Website", "url": "http://www.ip33.com/md5.html" }
                ],
                "firmwareList": [
                    { "title": "Reposted Firmware (DFP-34X-2C2)", "url": "https://github.com/Anime4000/RTL960x/tree/main/Firmware/DFP-34X-2C2" }
                ]
            },
            {
                "category": "Volt mini olt",
                "name": "mini gpon olt SFP",
                "desc": "mini gpon olt SFP",
                "videoUrlList": [
                    { "title": "Set ONU to router mode", "url": "https://youtu.be/ckJvqJloSzg?is=03qWgC6W4H0qiQox" },
                    { "title": "Set ONU to bridge mode", "url": "https://youtu.be/QFcUg1Ra1p0?is=zFiDKugYn9h1TeVn" },
                    { "title": "How to Install VOLT Software", "url": "https://youtu.be/zTkDRKb20QM?is=U_GQk3XpTTJrivRB" }
                ],
                "pdfList": [],
                "softwareList": [
                    { "title": "For volt software", "url": "https://mega.nz/folder/uopBTQYI#0XRXL0XkLRK3GAoaL8RVkQ" }
                ],
                "firmwareList": []
            },
            {
                "category": "Vsol ONU/Olt",
                "name": "Vsol ONU/Olt",
                "desc": "V2801SG/V2801Q/V2802RH/OLT",
                "videoUrlList": [
                    { "title": "Change SN and MAC address", "url": "https://youtu.be/mH7NNXCYMK8?is=XdmunwA5zcqQjr9x" },
                    { "title": "Login IP & Telnet Enable", "url": "https://youtu.be/mHXsrBKqy3k?is=xEB6T5Wd6g-FalOA" }
                ],
                "pdfList": [],
                "softwareList": [],
                "firmwareList": []
            }
        ];

        const productContainer = document.getElementById('product-list');

        // 循环遍历数据并生成 HTML
        products.forEach(product => {
            let resourcesHtml = '';

            if (product.videoUrlList.length > 0) {
                resourcesHtml += `<div class="resource-block"><h4>Videos / Tutorials</h4><ul>`;
                product.videoUrlList.forEach(item => {
                    resourcesHtml += `<li><a href="${item.url}" target="_blank" class="link-item">▶️ ${item.title}</a></li>`;
                });
                resourcesHtml += `</ul></div>`;
            }

            if (product.softwareList.length > 0) {
                resourcesHtml += `<div class="resource-block"><h4>Software / Tools</h4><ul>`;
                product.softwareList.forEach(item => {
                    resourcesHtml += `<li><a href="${item.url}" target="_blank" class="link-item">💻 ${item.title}</a></li>`;
                });
                resourcesHtml += `</ul></div>`;
            }

            if (product.firmwareList.length > 0) {
                resourcesHtml += `<div class="resource-block"><h4>Firmware</h4><ul>`;
                product.firmwareList.forEach(item => {
                    resourcesHtml += `<li><a href="${item.url}" target="_blank" class="link-item">⚙️ ${item.title}</a></li>`;
                });
                resourcesHtml += `</ul></div>`;
            }

            const cardHtml = `
                <div class="support-card">
                    <h2>${product.name}</h2>
                    <p class="category-tag">${product.category}</p>
                    <p class="desc">${product.desc}</p>
                    <div class="resource-container">
                        ${resourcesHtml}
                    </div>
                </div>
            `;
            productContainer.innerHTML += cardHtml;
        });
    </script>
</body>
</html>
