<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Support</title>
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: system-ui,-apple-system,sans-serif;
        }
        body {
            background:#f7f9fc;
            color:#222;
        }
        .category-nav {
            background:#ffffff;
            box-shadow:0 1px 4px rgba(0,0,0,0.08);
            margin-bottom:28px;
        }
        .category-nav .container {
            max-width:1240px;
            margin:0 auto;
            padding:14px 20px;
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }
        .category-item {
            padding:9px 22px;
            border-radius:8px;
            background-color:#f4f7fb;
            color:#222;
            text-decoration:none;
            transition:0.22s ease;
        }
        .category-item.active {
            background-color:#1f56d3;
            color:#fff;
        }
        .category-item:hover:not(.active) {
            background-color:#e2e8f0;
        }
        .main-content{
            max-width:1240px;
            margin:0 auto;
            padding:0 20px 40px;
        }
        h1{
            margin-bottom:24px;
            font-size:24px;
        }
        .support-card{
            background:#fff;
            border-radius:10px;
            padding:20px;
            margin-bottom:20px;
            box-shadow:0 2px 8px rgba(0,0,0,0.07);
        }
        .support-card h2{
            font-size:18px;
            margin-bottom:8px;
        }
        .support-desc{
            color:#555;
            margin-bottom:12px;
        }
        .support-card img{
            max-height:160px;
            object-fit:contain;
            margin-bottom:12px;
        }
        .block-title{
            font-weight:bold;
            margin-top:14px;
            margin-bottom:6px;
        }
        ul{
            padding-left:22px;
            margin-bottom:8px;
        }
        a{
            color:#1f56d3;
            word-break:break-all;
        }
        .page-footer {
            background-color: #1a2436;
            color: #cbd5e1;
            padding: 32px 20px;
            margin-top: 60px;
        }
        .footer-inner {
            max-width: 1240px;
            margin: 0 auto;
        }
        .footer-contact p {
            margin: 8px 0;
            font-size: 15px;
        }
        .footer-contact a {
            color: #4ade80;
            text-decoration: none;
        }
        .footer-contact a:hover {
            text-decoration: underline;
        }
        .footer-copyright {
            margin-top:16px;
            font-size:13px;
            color:#94a3b8;
        }
        @media(max-width:768px){
            .category-nav .container{gap:8px;}
            .category-item{padding:7px 14px;font-size:14px;}
        }
    </style>
</head>
<body>
<div class="category-nav">
    <div class="container">
        <a class="category-item" href="index.html">全部</a>
        <a class="category-item" href="index.html#sfp">SFP模块</a>
        <a class="category-item" href="index.html#switch">交换机</a>
        <a class="category-item" href="index.html#onu">ONU设备</a>
        <a class="category-item active" href="support.html">技术支持</a>
        <a class="category-item" href="index.html#contact">联系我们</a>
    </div>
</div>

<main class="main-content">
    <h1>Technical Support‑Firmware, Software & Tutorial</h1>
    <div id="supportContainer"></div>
</main>

<footer class="page-footer" id="contact">
    <div class="footer-inner">
        <div class="footer-contact">
            <p>📧 Email：sales@example.com</p>
            <p>💬 WhatsApp：<a href="https://wa.me/8613800138000" target="_blank">+86 138 0013 8000</a></p>
        </div>
        <div class="footer-copyright">
            © 2026 All rights reserved
        </div>
    </div>
</footer>

<script>
let supportList = [];
async function loadSupportData(){
    const res = await fetch("./support.json");
    const data = await res.json();
    supportList = data.items || [];
    renderSupportPage();
}

function renderSupportPage(){
    const container = document.getElementById("supportContainer");
    container.innerHTML = "";
    supportList.forEach(dev=>{
        let html = `<div class="support-card">`;
        html += `<h2>${dev.name}</h2>`;
        html += `<div class="support-desc">${dev.desc||""}</div>`;
        if(dev.image) html += `<img src="${dev.image}" alt="${dev.name}">`;

        if(dev.spec && dev.spec.length>0){
            html += `<div class="block-title">Specifications</div><ul>`;
            dev.spec.forEach(s=> html += `<li>${s.name}: ${s.value}</li>`);
            html += `</ul>`;
        }
        if(dev.videoUrlList && dev.videoUrlList.length>0){
            html += `<div class="block-title">Tutorial Videos</div><ul>`;
            dev.videoUrlList.forEach(v=> html += `<li><a target="_blank" href="${v.url}">${v.title}</a></li>`);
            html += `</ul>`;
        }
        if(dev.softwareList && dev.softwareList.length>0){
            html += `<div class="block-title">Software Download</div><ul>`;
            dev.softwareList.forEach(s=> html += `<li><a target="_blank" href="${s.url}">${s.title}</a></li>`);
            html += `</ul>`;
        }
        if(dev.firmwareList && dev.firmwareList.length>0){
            html += `<div class="block-title">Firmware Download</div><ul>`;
            dev.firmwareList.forEach(f=> html += `<li><a target="_blank" href="${f.url}">${f.title}</a></li>`);
            html += `</ul>`;
        }
        html += `</div>`;
        container.innerHTML += html;
    })
}

window.onload = loadSupportData;
</script>
</body>
</html>
