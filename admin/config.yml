backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "软件与视频展示"
    folder: "/"
    create: false
    files:
      - file: "products.json"
        label: "全部展示数据"
        name: "products_json"
        fields:
          - label: "展示列表"
            name: "products"
            widget: "list"
            fields:
              - { label: "名称", name: "name", widget: "string" }
              - { label: "描述", name: "desc", widget: "text" }
              - { label: "视频链接", name: "videoUrl", widget: "string", required: false }
              - { label: "下载链接", name: "downloadUrl", widget: "string", required: false }
